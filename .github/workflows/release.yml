name: release

# Dispatched on main with the version in pyproject.toml. dry_run builds and tests
# only; otherwise the sdist goes to PyPI by trusted publishing and v<version> is
# tagged with a GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, as in pyproject.toml (e.g. 0.1.0a1)"
        required: true
      dry_run:
        description: "Build and test only"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          [ "$v" = "$VERSION" ] || { echo "pyproject.toml has $v, not $VERSION"; exit 1; }
          grep -q "^## $VERSION\$" CHANGELOG.md || { echo "CHANGELOG.md has no '## $VERSION'"; exit 1; }
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then
            echo "tag v$VERSION exists"; exit 1
          fi
      - name: FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libavcodec-dev libavfilter-dev libavutil-dev
      - name: Build the sdist
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg pkg-config \
            libavcodec-dev libavfilter-dev libavutil-dev
      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - name: Install the sdist and test it outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.tar.gz pytest
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP/tests"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q -p no:cacheprovider

  publish:
    needs: test
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.12.4
      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          awk -v h="## $VERSION" '$0 == h {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          pre=$(echo "$VERSION" | grep -Eq '(a|b|rc)[0-9]+$' && echo --prerelease || true)
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "cymedia $VERSION" --notes-file notes.md $pre
